# Local Postgres for development and integration tests. The pgvector image is
# used now so Phase 3 (embeddings) needs no database change.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scrapbook
      POSTGRES_PASSWORD: scrapbook
      POSTGRES_DB: scrapbook
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapbook"]
      interval: 2s
      timeout: 3s
      retries: 20
