name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run gofmt on these files." && exit 1)
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test ./...

  go-integration:
    name: Go integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scrapbook
          POSTGRES_PASSWORD: scrapbook
          POSTGRES_DB: scrapbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scrapbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://scrapbook:scrapbook@localhost:5432/scrapbook_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -tags integration -p 1 ./internal/db/ ./internal/classify/ ./internal/mcpserver/ ./internal/credits/

  sqlc:
    name: sqlc drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate
        working-directory: server
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src/db sqlc/sqlc:1.30.0 generate
      - name: Fail on changes
        run: |
          git status --porcelain server/internal/db
          if [ -n "$(git status --porcelain server/internal/db)" ]; then
            echo "The sqlc code is out of date. Regenerate it (docs/development.md) and commit it."
            git diff server/internal/db
            exit 1
          fi

  mobile:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
        with:
          directory: apps/mobile
      - name: Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
        with:
          directory: apps/website
      - run: bun run check
      - run: bun run test
      - run: bun run build

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - run: bun x changeset status --since=origin/$GITHUB_BASE_REF
