name: Release

# While changesets are pending, keeps a "Version packages" pull request open.
# Once it's merged (no changesets left), tags vX.Y.Z and creates the GitHub
# release from that version's CHANGELOG.md section.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'franco-roura' && !github.event.repository.private
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      # Only changesets that bump something count. Empty ones (`--empty`, for
      # docs and CI) have no package lines in their frontmatter; they're
      # cleared by the next real version.
      - name: Look for pending changesets
        id: pending
        run: |
          pending=false
          for f in .changeset/*.md; do
            [ "$(basename "$f")" = README.md ] && continue
            [ -e "$f" ] || continue
            if awk '/^---$/ { n++; next } n == 1 && NF { found = 1 } END { exit !found }' "$f"; then
              pending=true
            fi
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      # A PR opened with GITHUB_TOKEN doesn't trigger CI, so the Version PR
      # needs RELEASE_TOKEN (a fine-grained PAT) to pass the required checks.
      - name: Open or update the Version PR
        if: steps.pending.outputs.pending == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: bun run release:version
          pr-title: Version packages
          commit-message: Version packages
          # This workflow tags and releases in the next step, not the action.
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag and release
        if: steps.pending.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$version" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
