name: Set up Bun
description: Installs Bun and a directory's dependencies from its lockfile.
inputs:
  directory:
    description: Directory holding package.json and bun.lock
    default: .
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ inputs.directory }}-${{ hashFiles(format('{0}/bun.lock', inputs.directory)) }}
        restore-keys: bun-${{ runner.os }}-${{ inputs.directory }}-
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: bun install --frozen-lockfile
