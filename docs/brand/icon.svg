<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Scrapbook/01 app icon</title>
  <!-- Scrapbook/01 app icon: a Module/01 molded device on a studio tile, after Ledger/01's. Its screen
       shows a corner of the library graph. Colors are Module/01 tokens. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Mono:wght@400;700&amp;display=block');
      .hud { font-family: 'Space Mono', monospace; letter-spacing: 0.16em; }
      .disp { font-family: 'Michroma', sans-serif; }
    </style>
    <filter id="float" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c1e21" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="48" stdDeviation="40" flood-color="#1c1e21" flood-opacity="0.16" />
    </filter>
    <filter id="mold" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1c1e21" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1c1e21" flood-opacity="0.12" />
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c7d6" />
      <stop offset="1" stop-color="#b9bccd" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="screen">
      <rect x="248" y="300" width="528" height="268" rx="36" />
    </clipPath>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd9c7" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffd9c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Studio tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#tile)" />

  <!-- HUD: corner brackets and microprint -->
  <g stroke="#7c818a" stroke-width="4" fill="none" stroke-linecap="square">
    <path d="M120 176 V120 H176" />
    <path d="M848 120 H904 V176" />
    <path d="M120 848 V904 H176" />
    <path d="M848 904 H904 V848" />
  </g>
  <text x="200" y="133" class="hud" font-size="22" fill="#53575e">MOD-01 · SCRAPBOOK</text>
  <text x="824" y="133" class="hud" font-size="22" fill="#53575e" text-anchor="end">REV.A</text>
  <g fill="#7c818a">
    <rect x="200" y="888" width="4" height="16" />
    <rect x="232" y="894" width="4" height="10" />
    <rect x="264" y="894" width="4" height="10" />
    <rect x="296" y="894" width="4" height="10" />
    <rect x="328" y="888" width="4" height="16" />
    <rect x="360" y="894" width="4" height="10" />
    <rect x="392" y="894" width="4" height="10" />
    <rect x="424" y="894" width="4" height="10" />
    <rect x="456" y="888" width="4" height="16" />
  </g>
  <text x="824" y="904" class="hud" font-size="22" fill="#53575e" text-anchor="end">SHARE · SAVE</text>

  <!-- Device body: shell with the top-right notch -->
  <path filter="url(#float)" fill="#ffffff"
    d="M268 220 H732 L816 304 V744 Q816 820 740 820 H284 Q208 820 208 744 V296 Q208 220 284 220 Z" />
  <path fill="url(#sheen)"
    d="M268 220 H732 L816 304 V744 Q816 820 740 820 H284 Q208 820 208 744 V296 Q208 220 284 220 Z" />
  <path fill="none" stroke="#c9ccd2" stroke-width="2"
    d="M268 220 H732 L816 304 V744 Q816 820 740 820 H284 Q208 820 208 744 V296 Q208 220 284 220 Z" />
  <text x="248" y="270" class="hud" font-size="18" fill="#7c818a">S-01</text>
  <circle cx="700" cy="264" r="7" fill="#1fa45a" />
  <circle cx="700" cy="264" r="14" fill="#1fa45a" opacity="0.18" />

  <!-- Visor screen: a corner of the library graph -->
  <rect x="248" y="300" width="528" height="268" rx="36" fill="#1c1e21" />
  <g clip-path="url(#screen)">
    <g fill="#a3a7ae" fill-opacity="0.28">
      <circle cx="300" cy="380" r="2" /><circle cx="380" cy="380" r="2" /><circle cx="460" cy="380" r="2" />
      <circle cx="540" cy="380" r="2" /><circle cx="620" cy="380" r="2" /><circle cx="700" cy="380" r="2" />
      <circle cx="300" cy="460" r="2" /><circle cx="380" cy="460" r="2" /><circle cx="460" cy="460" r="2" />
      <circle cx="540" cy="460" r="2" /><circle cx="620" cy="460" r="2" /><circle cx="700" cy="460" r="2" />
      <circle cx="300" cy="540" r="2" /><circle cx="380" cy="540" r="2" /><circle cx="460" cy="540" r="2" />
      <circle cx="540" cy="540" r="2" /><circle cx="620" cy="540" r="2" /><circle cx="700" cy="540" r="2" />
    </g>
    <g stroke="#a3a7ae" stroke-opacity="0.55" stroke-width="3" fill="none">
      <path d="M352 470 L300 418" /><path d="M352 470 L318 526" /><path d="M352 470 L420 512" />
      <path d="M420 512 L476 448" /><path d="M300 418 L318 526" />
      <path d="M632 432 L700 396" /><path d="M632 432 L716 486" /><path d="M632 432 L572 522" />
      <path d="M700 396 L716 486" />
    </g>
    <path d="M476 448 L572 522" stroke="#ff5f1f" stroke-width="4" stroke-dasharray="10 8" fill="none" />
    <circle cx="352" cy="470" r="30" fill="#2fb5a3" stroke="#1c1e21" stroke-width="4" />
    <circle cx="632" cy="432" r="30" fill="#f5b83d" stroke="#1c1e21" stroke-width="4" />
    <g fill="#ffffff" stroke-width="5">
      <circle cx="300" cy="418" r="13" stroke="#2fb5a3" /><circle cx="318" cy="526" r="13" stroke="#2fb5a3" />
      <circle cx="420" cy="512" r="13" stroke="#2fb5a3" />
      <circle cx="700" cy="396" r="13" stroke="#f5b83d" /><circle cx="716" cy="486" r="13" stroke="#f5b83d" />
      <circle cx="572" cy="522" r="13" stroke="#f5b83d" />
    </g>
    <circle cx="476" cy="448" r="48" fill="url(#halo)" />
    <circle cx="476" cy="448" r="30" fill="none" stroke="#ff5f1f" stroke-width="3" stroke-dasharray="6 6" />
    <circle cx="476" cy="448" r="15" fill="#ffd9c7" stroke="#ff5f1f" stroke-width="5" />
  </g>
  <text x="280" y="346" class="hud" font-size="20" fill="#a3a7ae">MAP</text>
  <text x="744" y="346" class="hud" font-size="20" fill="#ffffff" text-anchor="end" font-weight="700">128 SAVES</text>

  <!-- Signal block: the nameplate, with grill slots cut into it -->
  <g filter="url(#mold)">
    <path fill="#ff5f1f" d="M276 600 H556 Q584 600 584 628 V744 Q584 772 556 772 H276 Q248 772 248 744 V628 Q248 600 276 600 Z" />
  </g>
  <path fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" d="M268 602 H564" stroke-linecap="round" />
  <text x="280" y="708" class="disp" font-size="52" fill="#1c1e21">S/01</text>
  <g fill="#d94a12">
    <rect x="488" y="628" width="12" height="116" rx="6" />
    <rect x="516" y="628" width="12" height="116" rx="6" />
    <rect x="544" y="628" width="12" height="116" rx="6" />
  </g>

  <!-- Keys: molded stadium buttons -->
  <g filter="url(#mold)">
    <rect x="616" y="600" width="160" height="72" rx="36" fill="#ffffff" stroke="#c9ccd2" stroke-width="2" />
    <rect x="616" y="700" width="160" height="72" rx="36" fill="#e7e9ec" />
  </g>
  <text x="696" y="652" class="disp" font-size="44" fill="#0f6e38" text-anchor="middle">+</text>
  <g transform="translate(672 712)" fill="none" stroke="#1c1e21" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40 L40 8" /><path d="M16 8 H40 V32" /></g>
</svg>
