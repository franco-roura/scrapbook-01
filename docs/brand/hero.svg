<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Scrapbook/01: share, sort, browse</title>
  <!-- The README hero: three app screens from docs/screenshots on a Module/01 canvas.
       Render with `bun run docs:render` after `bun run docs:screenshots`. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700&amp;family=Michroma&amp;family=Space+Mono:wght@400;700&amp;display=block');
      .disp { font-family: 'Michroma', sans-serif; }
      .hud { font-family: 'Space Mono', monospace; letter-spacing: 0.14em; }
      .cap { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 22px; fill: #1c1e21; }
    </style>
    <filter id="float" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1c1e21" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#1c1e21" flood-opacity="0.14"/>
    </filter>
    <clipPath id="screen1"><rect x="0" y="0" width="390" height="680" rx="34"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c818a"/>
    </marker>
  </defs>

  <path d="M36 0 H1556 L1600 44 V864 Q1600 900 1564 900 H36 Q0 900 0 864 V36 Q0 0 36 0 Z" fill="#f3f4f6" stroke="#c9ccd2" stroke-width="2"/>
  <g stroke="#7c818a" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M40 76 V40 H76"/>
    <path d="M1524 856 H1560 V820"/>
  </g>
  <text x="100" y="58" class="hud" font-size="14" fill="#7c818a">SCRAPBOOK/01 · SHARE IT TO YOURSELF</text>

  <!-- 01 Share -->
  <g transform="translate(140 110)">
    <rect x="-10" y="-10" width="410" height="700" rx="42" fill="#ffffff" stroke="#c9ccd2" filter="url(#float)"/>
    <image href="../screenshots/share.png" width="390" height="844" clip-path="url(#screen1)" preserveAspectRatio="xMidYMin slice"/>
    <rect x="0" y="0" width="390" height="680" rx="34" fill="none" stroke="#c9ccd2"/>
  </g>
  <rect x="140" y="824" width="44" height="26" rx="6" fill="#ff5f1f"/>
  <text x="152" y="843" class="hud" font-size="14" fill="#1c1e21">01</text>
  <text x="198" y="845" class="cap">Share it, say what it’s about</text>

  <!-- 02 Sorted -->
  <g transform="translate(605 110)">
    <rect x="-10" y="-10" width="410" height="700" rx="42" fill="#ffffff" stroke="#c9ccd2" filter="url(#float)"/>
    <image href="../screenshots/library.png" width="390" height="844" clip-path="url(#screen1)" preserveAspectRatio="xMidYMin slice"/>
    <rect x="0" y="0" width="390" height="680" rx="34" fill="none" stroke="#c9ccd2"/>
  </g>
  <rect x="605" y="824" width="44" height="26" rx="6" fill="#ff5f1f"/>
  <text x="616" y="843" class="hud" font-size="14" fill="#1c1e21">02</text>
  <text x="663" y="845" class="cap">It files itself into a category</text>

  <!-- 03 Browse -->
  <g transform="translate(1070 110)">
    <rect x="-10" y="-10" width="410" height="700" rx="42" fill="#ffffff" stroke="#c9ccd2" filter="url(#float)"/>
    <image href="../screenshots/item-connections.png" width="390" height="844" y="-150" clip-path="url(#screen1)" preserveAspectRatio="xMidYMin slice"/>
    <rect x="0" y="0" width="390" height="680" rx="34" fill="none" stroke="#c9ccd2"/>
  </g>
  <rect x="1070" y="824" width="44" height="26" rx="6" fill="#ff5f1f"/>
  <text x="1081" y="843" class="hud" font-size="14" fill="#1c1e21">03</text>
  <text x="1128" y="845" class="cap">Browse what it links to</text>

  <path d="M560 450 H590" stroke="#7c818a" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#head)"/>
  <path d="M1025 450 H1055" stroke="#7c818a" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#head)"/>
</svg>
